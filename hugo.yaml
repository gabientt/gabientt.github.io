baseURL: 'https://gabientt.github.io/'
languageCode: 'pt-br'
title: 'Enquanto Compila | Gabriely Vicente'
theme: 'hugo-profile'

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  title: 'Enquanto Compila'
  description: 'Projetos de uma engenheira de computacao'

  color:
    backgroundColor: "#F5EAEC"
    secondaryBackgroundColor: "#F0DDE0"
    textColor: "#4E2D28"
    secondaryTextColor: "#70454E"
    primaryColor: "#70454E"
    secondaryColor: "#F0DDE0"
    textLinkColor: "#AE736F"
    darkmode:
      backgroundColor: "#281A1A"
      secondaryBackgroundColor: "#4E2D28"
      textColor: "#F5EAEC"
      secondaryTextColor: "#DDA8B0"
      primaryColor: "#DDA8B0"
      secondaryColor: "#4E2D28"
      textLinkColor: "#AE736F"

  hero:
    enable: true
    intro: 'Ola, eu sou a'
    title: 'Gabriely Vicente'
    subtitle: 'Estudante de Engenharia de Computação'
    content: 'Bem-vindos ao Enquanto Compila.'
    image: 'perfil.jpeg'
    button:
      enable: true
      name: 'Ver Projetos'
      url: '/posts/'
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: 'https://github.com/gabientt'
        - icon: fab fa-linkedin
          url: 'https://www.linkedin.com/in/gabriely-vicente-7b6931272'

  about:
    enable: true
    title: 'Sobre o Enquanto Compila'
    content: '<div style="text-align: justify;">Enquanto Compila é um espaço onde tecnologia e simplicidade caminham juntas. Aqui, aprender sobre código é como uma boa conversa no café da tarde: leve, direta e sem complicação. Nesta página, você vai encontrar projetos práticos, explicações claras e reflexões sobre o universo da tecnologia. Conteúdos pensados para transformar aprendizado em algo acessível, aplicável e, acima de tudo, humano. Porque entender o que você constrói é tão importante quanto construir.</div>'

  blog:
    enable: true
    title: 'Posts'

menu:
  main:
    - identifier: blog
      name: Blog
      url: /posts
      weight: 1

markup:
  goldmark:
    renderer:
      unsafe: true
